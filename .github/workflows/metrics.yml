# Renders a rich profile metrics SVG and commits it into the repo, so the
# README embeds a static file that always loads — unlike the shared public
# card instances, which share one rate-limited GitHub token across all users.
# Uses the built-in GITHUB_TOKEN (no PAT needed) against public profile data.
name: Metrics
on:
  schedule:
    - cron: '0 6 * * *' # daily refresh
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          # A personal access token is required to aggregate across ALL repos
          # (languages, habits, repo stats); the built-in token only sees this
          # repo. Falls back to it until METRICS_TOKEN is added (limited render).
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Daaboulex
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Berlin
          config_animations: no

          # Dark theme to match the profile palette (the classic template is light).
          extras_css: |
            body { background: #1a1b27; color: #c0caf5; }
            svg { color: #c0caf5; }
            h1, h2, h3 { color: #b060c0 !important; }
            .field, .field span, .field div { color: #c0caf5 !important; }
            .field svg { fill: #82d44a; }
            a, a * { color: #78c0e8 !important; }
            .day[fill="#ebedf0"] { fill: #2a2e45 !important; }

          # most-used is byte-based but RELIABLE with a least-privilege token.
          # (recently-used / indepth / habits all need cross-repo commit access
          # the read-only own-repo token lacks → they hang or error.) Skip the
          # byte-heavy non-Nix noise — old ML/Jupyter/robotics coursework, the
          # archived JS project, and vendored-source forks — so the Nix
          # packaging fleet leads. linux-corecycler is kept (own project).
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_skipped: >-
            CPI_Timeseries_ARIMA, ComputerVission, BeSus, RIS-Lab-1-uuv_simulator,
            hotspotshield-nix, vkBasalt_overlay_wayland, nix-cachyos-kernel,
            kachow

          # Contribution calendar (isometric, full year)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

